name: Compose acceptance tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The workflow only reads repository contents and does not publish images.
permissions:
  contents: read

jobs:
  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create runtime environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start healthy services
        run: docker compose up --detach --build --wait --wait-timeout 120

      - name: Verify proxy is unprivileged
        run: test "$(docker compose exec -T proxy id -u)" -ne 0

      - name: Run acceptance tests
        run: make test

      - name: Show container health
        run: docker compose ps

      # Logs are retained in the failed job output and greatly simplify diagnosis.
      - name: Print logs
        if: always()
        run: docker compose logs --no-color --tail=200

      - name: Clean up
        if: always()
        run: docker compose down --volumes --remove-orphans
