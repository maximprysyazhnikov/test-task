# Nginx is the only externally reachable Compose service.
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Preserve a caller-provided request ID or generate one when it is absent.
    map $http_x_request_id $request_id_to_forward {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format main '$remote_addr request_id=$request_id_to_forward '
                    '"$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    # Limit each client IP to 10 requests/second; a small burst absorbs jitter.
    limit_req_zone $binary_remote_addr zone=per_client:10m rate=10r/s;
    limit_req_status 429;

    upstream app_backend {
        server app:8080;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        location / {
            limit_req zone=per_client burst=5 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id_to_forward;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://app_backend;
        }
    }
}
